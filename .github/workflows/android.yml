name: Android APK
on: { push: { branches: [main] }, workflow_dispatch: {} }
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Decompresser le projet
        run: |
          mkdir tmp
          unzip -q "$(ls *.zip | head -1)" -d tmp
          d=$(dirname "$(find tmp -name package.json -not -path '*/node_modules/*' | head -1)")
          mv "$d" app
      - name: Nom de l'application = Aca
        run: sed -i 's/"appName": *"[^"]*"/"appName": "Aca"/' capacitor.config.json
        working-directory: app
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 17 }
      - run: npm install
        working-directory: app
      - run: npx cap add android
        working-directory: app
      - run: npx capacitor-assets generate --android --assetPath resources --iconBackgroundColor "#ffffff" --splashBackgroundColor "#ffffff"
        working-directory: app
      - run: npx cap sync android
        working-directory: app
      - run: chmod +x gradlew && ./gradlew assembleDebug
        working-directory: app/android
      - uses: actions/upload-artifact@v4
        with:
          name: Aca-apk
          path: app/android/app/build/outputs/apk/debug/app-debug.apk
